        target: /sources/references
        read_only: true
      - type: bind
        source: ${PATH_ARMY_LSS}
        target: /sources/army_lss
        read_only: true
      - type: bind
        source: ${PATH_ARMY_1TSC}
        target: /sources/army_1tsc
        read_only: true
      - type: bind
